# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: 2974 Walton Robotics
email: contactus@waltonrobotics.org
description: >-
  Walton Robotics, FIRST Team 2974, started in 2008 in Marietta, GA with 10 members, 2 mentors, and 2 sponsors.
  We now have over 40 members and many dedicated mentors and sponsors.
  Our coaches, two Walton High teachers, spend 1,000 hours yearly on FIRST. 
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
youtube_username: "@2974walt"
github_username:  WaltonRobotics
instagram_username: "2974walt"
lang: en
timezone: America/New_York

# TeXt theme author info (used in footer/sidebar links)
author:
  type  : organization
  name  : 2974 Walton Robotics
  avatar: /assets/logo-square.png
  email : contactus@waltonrobotics.org
  github: WaltonRobotics

repository: WaltonRobotics/WaltonRobotics.github.io
repository_tree: main
# Build settings
markdown: kramdown
remote_theme: "kitian616/jekyll-TeXt-theme"
highlighter: rouge
permalink: date
excerpt_separator: <!--more-->
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
include:
  - _pages

# TeXt theme settings
# "default" (light) is the base skin; the navy/red palette and dark mode are
# layered on top with CSS variables in _sass/custom.scss.
text_skin: default
highlight_theme: tomorrow-night

# Walton Robotics brand / chrome (used by _includes/header.html & footer.html)
wrt:
  number: "2974"
  name: Walton Robotics
  logo: /assets/logo-square.png
  tagline: Marietta, Georgia · FIRST Robotics Competition
  default_theme: auto        # auto (follow OS) | light | dark
  cta:
    text: Support WRT
    url: /sponsors/
  social:                    # entries without a url show as a greyed-out placeholder
    - name: Instagram
      url: https://www.instagram.com/2974walt/
    - name: X / Twitter
      url:                   # TODO: e.g. https://x.com/<handle>
    - name: YouTube
      url: https://www.youtube.com/@2974walt
    - name: Chief Delphi
      url:                   # TODO: e.g. https://www.chiefdelphi.com/u/<user>
    - name: GitHub
      url: https://github.com/WaltonRobotics
    - name: The Blue Alliance
      url: https://www.thebluealliance.com/team/2974
  qr_code:                   # path to a QR image, e.g. /assets/qr.png
  leadership: []             # - { role: Executive Director, name: ..., email: ... }
mathjax: true
search:
  provider: default

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      aside:
        toc: true
      show_subscribe: true
  - scope:
      path: "_pages"
    values:
      layout: article
      show_edit_on_github: false

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - node_modules
  - vendor/
  - .sass-cache/
