<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Oswald:ital,wght@0,500;0,700;1,500;1,700&family=Lexend:wght@400;500;600;700&display=swap">
<script>
  (function () {
    var fallback = {{ site.wrt.default_theme | default: 'auto' | jsonify }};
    var saved = localStorage.getItem('wrt-theme');
    var theme = saved || (fallback !== 'auto' ? fallback :
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
